# Port Wrangler UI — static SPA + API pass-through.
# The UI calls the backend with relative /api URLs, so proxying /api here
# keeps the UI fully functional when accessed directly (not via Caddy).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend on each request (survives app container restarts).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://app:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE (agent chat) — no buffering, allow long-lived streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # SPA fallback — client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
